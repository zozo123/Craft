[package]
name = "craft-client"
description = "wgpu Craft client (walkable local world)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "craft_client"
path = "src/lib.rs"

[[bin]]
name = "craft"
path = "src/main.rs"

[dependencies]
craft-core = { path = "../craft-core" }
craft-protocol = { path = "../craft-protocol" }
winit = { version = "0.30", default-features = true }
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
craft-server = { path = "../craft-server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tempfile = "3"

[lints]
workspace = true
