[package]
name = "craft-server"
description = "Tokio multiplayer server replacing server.py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "craft_server"
path = "src/lib.rs"

[[bin]]
name = "craft-server"
path = "src/main.rs"

[dependencies]
craft-core = { path = "../craft-core" }
craft-protocol = { path = "../craft-protocol" }
craft-db = { path = "../craft-db" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
craft-protocol = { path = "../craft-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tempfile = "3"

[lints]
workspace = true
